function fmtAI(x){

  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')

function aiToggle(o){

 if(op&&!$('#aim').children.length) aiAdd('b',T[S.lang].aiw);

function aiAdd(k,tx){

 d.className='mb '+k;
 if(k=='u') d.textContent=tx;
 else d.innerHTML=fmtAI(tx);
 m.appendChild(d);
 m.scrollTop=m.scrollHeight;
 return d;
}

async function aiSend(tx){

 $('#aii').value = '';
 aiToggle(true);
 aiH.push({role:'user', content:tx});
 aiAdd('u', tx);

 const el = aiAdd('b', '<span class="dots"><span>●</span><span>●</span><span>●</span></span>');
 aiBusy = true;

 // Simulate ultra-fast processing time for rich interaction
 setTimeout(()=>{
  const reply = generateSmartReply(tx, S.lang);
  aiH.push({role:'assistant', content:reply});
  el.innerHTML = reply;
  
  // Add Voice button to the AI response if English text present
  const spkBtn = document.createElement('button');
  spkBtn.className = 'spk mt-2';

  spkBtn.style.padding = '0 12px';

  aiBusy = false;
  $('#aim').scrollTop = $('#aim').scrollHeight;
 }, 300);
}

 document.querySelectorAll('#stats [data-n]').forEach(e=>{
  const n=+e.dataset.n,t0=performance.now(),f=now=>{
